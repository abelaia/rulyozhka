      (function () {
        try {
          var t = localStorage.getItem('rulyozhka-theme');
          if (t !== 'light') {
            document.documentElement.classList.add('dark-theme');
          }
        } catch (e) {
          document.documentElement.classList.add('dark-theme');
        }
      })();
